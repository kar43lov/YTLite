name: Build WebClientSpoof only

on:
  workflow_dispatch:

jobs:
  build:
    name: Build WebClientSpoof dylib
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Dependencies
        run: brew install make ldid dpkg

      - name: Set PATH / THEOS
        run: |
          echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH
          echo "THEOS=${{ github.workspace }}/theos" >> $GITHUB_ENV

      - name: Setup Theos
        uses: actions/checkout@v6
        with:
          repository: theos/theos
          ref: 9bc73406cf80b711ef4d02c15ff1dedc4478a275
          path: theos
          submodules: recursive

      - name: Download iOS SDK
        run: |
          git clone --quiet -n --depth=1 --filter=tree:0 https://github.com/theos/sdks/
          cd sdks
          git sparse-checkout set --no-cone iPhoneOS16.5.sdk
          git checkout
          mv *.sdk $THEOS/sdks

      - name: Build WebClientSpoof
        run: |
          cd WebClientSpoof && make clean package DEBUG=0 FINALPACKAGE=1
          echo "--- otool -L on built dylib ---"
          find . -name '*.dylib' -exec /usr/bin/otool -L {} \;

      - name: Upload deb + dylib
        uses: actions/upload-artifact@v7
        with:
          name: webspoof-build
          path: |
            WebClientSpoof/packages/*.deb
            WebClientSpoof/.theos/obj/**/*.dylib
          if-no-files-found: warn
          retention-days: 3
